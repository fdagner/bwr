<div id="mailHtml"
  style="font-family:Arial,Helvetica,sans-serif;width:700px;background:#fff;border:1.5px solid #e6d8ca;color:#1f2937;display:flex;">

  <div style="flex:1;min-width:0;">
    <div style="display:flex;justify-content:space-between;align-items:center;background:#f3f4f6;color:#6b7280;font-size:12px;height:26px;padding:0 14px;">
      <span><u>D</u>atei &nbsp;·&nbsp; <u>B</u>earbeiten &nbsp;·&nbsp; <u>A</u>nsicht &nbsp;·&nbsp; <u>N</u>achricht &nbsp;·&nbsp; <u>H</u>ilfe</span>
      <span>–&nbsp;&nbsp;☐&nbsp;&nbsp;✕</span>
    </div>

    <div style="padding:16px 16px 12px;">
      <div style="font-size:11px;letter-spacing:2px;font-weight:bold;color:#ea580c;">NEUE NACHRICHT</div>
      <div id="emailSubject"
        style="font-size:24px;font-weight:bold;color:#111827;margin-top:6px;min-height:1.2em;line-height:1.2;">[Hier Betreff einfügen]</div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin:0 16px;padding:10px 0;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;">
      <div style="width:75px;height:75px;display:flex;align-items:center;justify-content:center;">
        <svg id="emailSVG" style="width:65px;height:65px;display:block;" viewBox="0 0 50 50">
          <rect id="logo-placeholderEmail" x="0" y="0" width="50" Opacity="0" height="50" />
        </svg>
      </div>
      <div style="flex:1;min-width:0;font-size:14px;line-height:1.6;">
        <div><span style="display:inline-block;width:38px;color:#9ca3af;font-size:12px;text-transform:uppercase;">Von</span><span class="emailInhaber" style="font-weight:bold;color:#ea580c;min-height:1.2em;"></span></div>
        <div><span style="display:inline-block;width:38px;color:#9ca3af;font-size:12px;text-transform:uppercase;">An</span><span class="emailNameKunde"></span> &lt;<span class="emailAdresseKunde"></span>&gt;</div>
      </div>
    </div>

    <div style="margin:16px;padding:18px 20px 20px;background:#fffaf5;border-left:4px solid #ea580c;font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.45;">
      <p style="margin:0 0 16px;">Sehr geehrter Herr /sehr geehrte Frau <span class="emailNameKunde"></span>,</p>
      <p id="emailTextMessage" style="margin:0 0 16px;">[Hier Mailtext bearbeiten]</p>
      <p style="margin:32px 0 0;">Mit freundlichen Grüßen</p>
      <div style="margin-top:22px;padding-top:10px;border-top:1px dotted #9ca3af;">
        <p style="margin:0;"><span class="emailInhaber" style="font-weight:bold;"></span><br><span id="emailName" style="color:#6b7280;font-size:15px;"></span></p>
      </div>
    </div>
  </div>
</div>
