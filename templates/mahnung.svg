<svg id="mahnungSVG" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 760" font-family="Arial" style="height: auto;background-color:#fff;padding:0px;width:100%;max-width:720px;border: 1px solid #ccc;border-bottom:0px">
 <defs id="customDefsMahnung"/>
 <!--Gruppe für Firmeninformationsen (Briefkopf)-->
 <rect x="0.5" y="0.5" width="719" height="754" stroke="#ccc" stroke-width="1" fill="white" />
 <rect id="mahnungAkzentlinie" x="0" y="90" width="720" height="5" fill="red" />
 <text id="mahnungName" x="20" y="65" font-size="30" font-weight="bold" italic="italic" fill="#000"/>
 <text class="mahnungKontaktzeile" x="20" y="120" font-size="13" text-decoration="underline" fill="#000"/>
 <rect id="logo-placeholderMahnung" x="580" y="15" width="120" height="70" Opacity="0"/>
 <!--Gruppe für Empfängerdaten-->
 <g id="kundenDaten" font-size="17">
  <text id="mahnungKundeName" x="20" y="195" fill="#000"/>
  <text id="mahnungKundeInhaber" x="20" y="215" fill="#000"/>
  <text id="mahnungKundeStrasse" x="20" y="235" fill="#000"/>
  <text id="mahnungKundeOrt" x="20" y="255" fill="#000"/>
 </g>
 <!--Ort und Datum rechts-->
 <text x="700" y="195" font-size="17" text-anchor="end" fill="#300033"><tspan class="mahnungOrt"/>, <tspan id="mahnungTag">01</tspan>.<tspan id="mahnungMonat">01</tspan>.<tspan class="aktuellesJahrMahnung"/></text>
 <!--Titel-->
 <text id="mahnungTitel" x="20" y="310" font-size="24" font-weight="bold" fill="#000">Mahnung</text>
 <!--Anschreiben-->
 <g font-size="17" fill="#000">
  <text x="20" y="350">Sehr geehrte Damen und Herren,</text>
  <text x="20" y="380">leider konnten wir bis heute keinen Zahlungseingang für die Rechnung Nr. <tspan id="mahnungRechnungsNummer"></tspan></text>
  <text x="20" y="403">feststellen.<tspan id="mahnungEinleitungEnde"> Daher belasten wir Sie mit:</tspan></text>
 </g>
 <!--Berechnungsblock-->
 <g font-size="17" fill="#000">
  <text x="20" y="445" text-anchor="start">Rechnungsbetrag vom <tspan id="mahnungRechnungsdatum"></tspan></text>
  <text id="mahnungBetrag" x="700" y="445" text-anchor="end"></text>
  <g id="mahnungZeileZinsen">
   <text x="20" y="470" text-anchor="start">+</text>
   <text x="40" y="470" text-anchor="start">Verzugszinsen <tspan id="mahnungZinssatzText"></tspan> % p. a. für <tspan id="mahnungTage"></tspan> Tage</text>
   <text id="mahnungZinsen" x="700" y="470" text-anchor="end"></text>
  </g>
  <g id="mahnungZeilePauschale">
   <text x="20" y="495" text-anchor="start">+</text>
   <text x="40" y="495" text-anchor="start">Mahngebühren (pauschal)</text>
   <text id="mahnungPauschale" x="700" y="495" text-anchor="end"></text>
  </g>
  <text id="mahnungSummeOp" x="20" y="525" text-anchor="start" font-weight="bold">=</text>
  <text id="mahnungSummeLabel" x="40" y="525" text-anchor="start" font-weight="bold">Gesamtforderung</text>
  <text id="mahnungSumme" x="700" y="525" text-anchor="end" font-weight="bold"></text>
  <rect id="mahnungSummeLinie" x="20" y="535" width="680" height="2" fill="#000"/>
 </g>
 <!--Zahlungsaufforderung-->
 <g font-size="17" fill="#000">
  <text x="20" y="570"><tspan id="mahnungZahltext1">Wir bitten Sie, die Gesamtforderung spätestens bis zum </tspan><tspan id="mahnungFrist"></tspan><tspan id="mahnungZahltext2"> auf</tspan></text>
  <text x="20" y="593">dieses Bankkonto zu überweisen:</text>
  <text x="40" y="616"><tspan id="mahnungBank"></tspan></text>
  <text x="40" y="639">IBAN: <tspan id="mahnungIban"></tspan> · BIC: <tspan id="mahnungBic"></tspan></text>
  <text id="mahnungHinweis" x="20" y="673"/>
  <text x="20" y="703">Sollten Sie zwischenzeitlich die Zahlung geleistet haben, betrachten Sie</text>
  <text x="20" y="726">dieses Schreiben bitte als gegenstandslos.</text>
 </g>
 <!--Perforation unten (identisch zum Bescheid-Rand)-->
 <circle cx="10" cy="760" r="10" stroke-width="1" stroke="gray" fill="white" />
 <circle cx="30" cy="760" r="10" stroke-width="1" stroke="gray" fill="white" />
