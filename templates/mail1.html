<div id="mailHtml"
  style="font-family:Arial,Helvetica,sans-serif;width:700px;background:#fff;border:1.5px solid #bcd6f5;color:#14213d;">

  <div style="display:flex;align-items:center;justify-content:space-between;background:#eaf3fd;color:#1e3a5f;font-size:12px;height:26px;padding:0 12px;">
    <span style="display:flex;align-items:center;gap:9px;">
      <svg width="15" height="11" viewBox="0 0 15 11">
        <rect width="15" height="11" rx="1" fill="#3b82c4" />
        <path d="M0 0 L7.5 6.5 L15 0" fill="none" stroke="#fff" stroke-width="1.2" />
      </svg>
      Neue Nachricht
    </span>
    <span>–&nbsp;&nbsp;☐&nbsp;&nbsp;✕</span>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;background:#cfe4fa;color:#14213d;padding:18px 20px;">
    <div style="flex:1;min-width:0;">
      <div style="font-size:11px;letter-spacing:2px;color:#4a6a8f;">BETREFF</div>
      <div id="emailSubject" style="font-size:22px;font-weight:bold;color:#0f2744;margin-top:6px;line-height:1.25;min-height:1.2em;">[Hier Betreff einfügen]</div>
    </div>
    <div style="flex:0 0 75px;width:75px;height:75px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;">
      <svg id="emailSVG" style="width:65px;height:65px;display:block;" viewBox="0 0 50 50">
        <rect id="logo-placeholderEmail" x="0" y="0" width="50" Opacity="0" height="50" />
      </svg>
    </div>
  </div>

  <div style="display:flex;background:#f3f8fe;border-bottom:1px solid #d6e6f8;padding:14px 20px;gap:30px;">
    <div style="flex:1;min-width:0;">
      <div style="font-size:11px;letter-spacing:2px;color:#5f7fa3;">VON</div>
      <div class="emailInhaber" style="font-size:16px;font-weight:bold;color:#1e4f8a;margin-top:4px;min-height:1.2em;"></div>
    </div>
    <div style="flex:1.4;min-width:0;">
      <div style="font-size:11px;letter-spacing:2px;color:#5f7fa3;">AN</div>
      <div style="font-size:16px;margin-top:4px;min-height:1.2em;"><span class="emailNameKunde"></span> &lt;<span class="emailAdresseKunde"></span>&gt;</div>
    </div>
  </div>

  <div style="padding:26px 20px 20px;font-size:17px;line-height:1.5;">
    <p style="margin:0 0 18px;">Sehr geehrter Herr /sehr geehrte Frau <span class="emailNameKunde"></span>,</p>
    <p id="emailTextMessage" style="margin:0 0 18px;">[Hier Mailtext bearbeiten]</p>
    <p style="margin:32px 0 0;">Mit freundlichen Grüßen</p>
    <div style="width:40px;border-top:3px solid #3b82c4;margin:14px 0 10px;"></div>
    <p style="margin:0;"><span class="emailInhaber" style="font-weight:bold;"></span><br><span id="emailName" style="color:#6b7280;"></span></p>
  </div>

  <div style="display:flex;align-items:center;gap:10px;border-top:1px solid #d6e6f8;background:#f3f8fe;padding:14px 20px;font-size:14px;flex-wrap:wrap;">
    <span style="display:flex;align-items:center;gap:8px;padding:9px 18px;background:#bcd6f5;color:#0f2744;border-radius:6px;font-weight:bold;"><svg width="16" height="12" viewBox="0 0 20 14">
        <path d="M9 1 L1 7 L9 13 M1 7 H17 C22 7 22 14 17 14" fill="none" stroke="#0f2744" stroke-width="2.4" /></svg>Antworten</span>
    <span style="display:flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid #9cc0ea;color:#1e3a5f;border-radius:6px;"><svg width="18" height="12" viewBox="0 0 22 14">
        <path d="M15 1 L8 7 L15 13 M7 1 L0 7 L7 13" fill="none" stroke="#1e3a5f" stroke-width="2" /></svg>Allen antworten</span>
    <span style="display:flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid #9cc0ea;color:#1e3a5f;border-radius:6px;"><svg width="15" height="12" viewBox="0 0 18 14">
        <path d="M1 7 H15 M10 1 L16 7 L10 13" fill="none" stroke="#1e3a5f" stroke-width="2" /></svg>Weiterleiten</span>
    <span style="flex:1;"></span>
    <span style="color:#6b7280;">Archivieren</span>
    <span style="color:#dc2626;margin-left:8px;">Löschen</span>
  </div>
</div>
