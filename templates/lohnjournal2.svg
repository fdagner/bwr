<svg id="lohnjournalSVG" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 380" style="height: auto;background-color:#fff;padding:0px;width:100%;max-width:760px" font-family="Helvetica" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
