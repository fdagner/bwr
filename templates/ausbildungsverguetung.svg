<svg id="ausbildungsverguetungSVG" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 760" style="height: auto;background-color:#fff;padding:0px;width:100%;max-width:760px">
   <defs id="customDefsAusbildungsverguetung">
   </defs>

  <!-- Hauptrahmen -->
  <rect x="0" y="0" width="760" height="760" fill="#fff" stroke="#000" stroke-width="2" />

  <!-- Firmen-Header -->
  <rect x="1" y="1" width="758" height="80" fill="#fff"/>
  <text id="lohnabrechnungFirmaName" x="20" y="65" font-family="Arial" font-size="32" fill="#17774f"></text>

  <!-- Titel -->
  <rect x="18" y="100" width="724" height="40" fill="#17774f"/>
  <text x="380" y="127" font-family="Arial" font-size="22" text-anchor="middle" fill="#fff">AUSBILDUNGSVERGÜTUNG</text>

  <!-- Abrechnungsmonat -->
  <text x="20" y="170" font-family="Arial" font-size="16">Abrechnungsmonat: <tspan id="lohnabrechnungMonat" ></tspan></text>

  <!-- Mitarbeiterdaten Box (gleiche Spalten wie lohnabrechnung.svg, plus Ausbildungs-Zeile) -->
  <rect x="18" y="185" width="724" height="180" fill="#d8f3e6"/>
  <text x="25" y="205" font-family="Arial" font-size="14" font-weight="bold" >Name, Vorname</text>
  <text x="200" y="205" font-family="Arial" font-size="14" font-weight="bold" >Straße</text>
  <text x="480" y="205" font-family="Arial" font-size="14" font-weight="bold" >PLZ/Ort</text>

  <text id="lohnabrechnungMitarbeiterName" x="25" y="225" font-family="Arial" font-size="14"></text>
  <text id="lohnabrechnungMitarbeiterStrasse" x="200" y="225" font-family="Arial" font-size="14"></text>
  <text id="lohnabrechnungFirmaOrt" x="480" y="225" font-family="Arial" font-size="14"></text>

  <text x="25" y="255" font-family="Arial" font-size="14" font-weight="bold" >Personalnr.</text>
  <text x="200" y="255" font-family="Arial" font-size="14" font-weight="bold" >Geburtsdatum</text>
  <text x="340" y="255" font-family="Arial" font-size="14" font-weight="bold" >Eintrittsdatum</text>
  <text x="480" y="255" font-family="Arial" font-size="14" font-weight="bold">Steueridentifikationsnr.</text>

  <text id="lohnabrechnungPersonalnr" x="25" y="275" font-family="Arial" font-size="14"></text>
  <text id="lohnabrechnungGeburtsdatum" x="200" y="275" font-family="Arial" font-size="14"></text>
  <text id="lohnabrechnungEintrittsdatum" x="340" y="275" font-family="Arial" font-size="14"></text>
  <text id="lohnabrechnungSteuerID" x="480" y="275" font-family="Arial" font-size="14"></text>

  <text x="25" y="305" font-family="Arial" font-size="14" font-weight="bold" >Lohnsteuerklasse</text>
  <text x="200" y="305" font-family="Arial" font-size="14" font-weight="bold">Kinderfreibetrag</text>
  <text x="340" y="305" font-family="Arial" font-size="14" font-weight="bold">Religion</text>
  <text id="lohnabrechnungBank" x="480" y="305" font-family="Arial" font-size="14" font-weight="bold"></text>

  <text id="lohnabrechnungSteuerklasse" x="25" y="320" font-family="Arial" font-size="14"></text>
  <text id="lohnabrechnungKinderfreibetrag" x="200" y="320" font-family="Arial" font-size="14"></text>
  <text id="lohnabrechnungReligion" x="340" y="320" font-family="Arial" font-size="14"></text>
  <text id="lohnabrechnungIBAN" x="480" y="320" font-family="Arial" font-size="14"></text>

  <!-- Ausbildungsdaten (eigene Zeile, Beruf links mit breitem Platz, Jahr rechts) -->
  <text x="25" y="345" font-family="Arial" font-size="14" font-weight="bold" >Ausbildungsberuf</text>
  <text x="480" y="345" font-family="Arial" font-size="14" font-weight="bold" >Ausbildungsjahr</text>
  <text id="lohnabrechnungAusbildungsberuf" x="25" y="363" font-family="Arial" font-size="14"></text>
  <text id="lohnabrechnungAusbildungsjahr" x="480" y="363" font-family="Arial" font-size="14"></text>

  <!-- Vergütung -->
  <rect x="18" y="380" width="724" height="25" fill="#d8f3e6"/>
  <text x="25" y="398" font-family="Arial" font-size="16" font-weight="bold" >Steuerpflichtige Ausbildungsvergütung</text>
  <text id="lohnabrechnungBrutto" x="735" y="398" font-family="Arial" font-size="16" font-weight="bold" text-anchor="end"></text>

  <!-- Steuerabzüge -->
  <text x="25" y="432" font-family="Arial" font-size="14">Lohnsteuer</text>
  <text id="lohnabrechnungLohnsteuer" x="735" y="432" font-family="Arial" font-size="14" text-anchor="end"></text>

  <text x="25" y="452" font-family="Arial" font-size="14">Solidaritätszuschlag</text>
  <text id="lohnabrechnungSoli" x="735" y="452" font-family="Arial" font-size="14" text-anchor="end"></text>

  <text x="25" y="472" font-family="Arial" font-size="14">Kirchensteuer</text>
  <text id="lohnabrechnungKirchensteuer" x="735" y="472" font-family="Arial" font-size="14" text-anchor="end"></text>

  <line x1="18" y1="485" x2="742" y2="485" stroke="#17774f" stroke-width="1"/>
  <text x="25" y="503" font-family="Arial" font-size="14">Steuerabzüge gesamt</text>
  <text id="lohnabrechnungSteuerGesamt" x="735" y="503" font-family="Arial" font-size="14" text-anchor="end"></text>

  <!-- Sozialversicherung -->
  <text x="25" y="530" font-family="Arial" font-size="14">Krankenversicherung</text>
  <text id="lohnabrechnungKrankenversicherung" x="735" y="530" font-family="Arial" font-size="14" text-anchor="end"></text>

  <text x="25" y="550" font-family="Arial" font-size="14">Pflegeversicherung</text>
  <text id="lohnabrechnungPflegeversicherung" x="735" y="550" font-family="Arial" font-size="14" text-anchor="end"></text>

  <text x="25" y="570" font-family="Arial" font-size="14">Rentenversicherung</text>
  <text id="lohnabrechnungRentenversicherung" x="735" y="570" font-family="Arial" font-size="14" text-anchor="end"></text>

  <text x="25" y="590" font-family="Arial" font-size="14">Arbeitslosenversicherung</text>
  <text id="lohnabrechnungArbeitslosenversicherung" x="735" y="590" font-family="Arial" font-size="14" text-anchor="end"></text>

  <line x1="18" y1="600" x2="742" y2="600" stroke="#17774f" stroke-width="1"/>
  <text x="25" y="618" font-family="Arial" font-size="14" class="text-italic">Sozialversicherungsabzüge gesamt</text>
  <text id="lohnabrechnungSVGesamt" x="735" y="618" font-family="Arial" font-size="14" class="text-italic" text-anchor="end"></text>

  <!-- Summen -->
  <rect x="18" y="640" width="724" height="25" fill="#d8f3e6"/>
  <text x="25" y="658" font-family="Arial" font-size="16" >Summe der gesetzlichen Abzüge</text>
  <text id="lohnabrechnungAbzuegeGesamt" x="735" y="658" font-family="Arial" font-size="16"  text-anchor="end"></text>

  <rect x="18" y="675" width="724" height="30" fill="#17774f"/>
  <text x="25" y="698" font-family="Arial" font-size="18" fill="#fff">Auszahlungsbetrag</text>
  <text id="lohnabrechnungNetto" x="735" y="698" font-family="Arial" font-size="18"  text-anchor="end"  fill="#fff"></text>
</svg>
