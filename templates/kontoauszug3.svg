<svg id="kontoauszugSVG" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 430" style="background-color:#eef1f5;padding:0px;width:100%;max-width:760px;border: 1px solid #ccc;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs id="customDefsKontoauszug">
  </defs>

  <!-- Hintergrund (Online-Banking-Oberfläche) -->
  <rect x="0" y="0" width="760" height="430" fill="#eef1f5" stroke="#eef1f5" stroke-width="2" />

  <!-- Kopfleiste -->
  <rect x="0" y="0" width="760" height="50" fill="#0b3a6e"/>
  <rect x="0" y="48" width="760" height="2" fill="#2f80ed"/>
  <text x="12" y="31" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fc3f0">Online-Banking &#124; Umsätze</text>
  <text id="kontoauszugBank" x="750" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="end" fill="#ffffff"></text>

  <!-- Kontodaten (Karte) -->
  <rect x="5" y="58" width="750" height="26" rx="6" ry="6" fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/>
  <text x="10" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#333333">IBAN: <tspan id="kontoauszugIban"></tspan> BIC: <tspan id="kontoauszugBic"></tspan></text>
  <text x="750" y="75" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#333333" text-anchor="end">Auszug Nr. <tspan id="kontoauszugNummer">24</tspan>/<tspan class="aktuellesJahrKontoauszug"></tspan></text>

  <!-- Kontoinhaber -->
  <text x="10" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0b3a6e" text-anchor="start">Kontoinhaber</text>
  <text x="10" y="375" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#333333" text-anchor="start"><tspan id="kontoauszugName"></tspan></text>
  <text x="10" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#333333" text-anchor="start"><tspan id="kontoauszugAdresse"></tspan></text>
  <text x="10" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#333333" text-anchor="start"><tspan id="kontoauszugOrt"></tspan></text>

  <!-- Umsatz-Karte -->
  <rect x="5" y="96" width="750" height="244" rx="8" ry="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1"/>
  <!-- Tabellenkopf -->
  <rect x="6" y="97" width="748" height="33" rx="7" ry="7" fill="#f6f8fb"/>
  <rect x="0" y="130" width="760" height="2" fill="#2f80ed"/>
  <!-- Zeilenwechsel-Hintergrund -->
  <rect x="6" y="136" width="748" height="44" fill="#f9fafc"/>
  <rect x="6" y="186" width="748" height="44" fill="#ffffff"/>
  <rect x="6" y="236" width="748" height="44" fill="#f9fafc"/>
  <rect x="6" y="184" width="748" height="1" fill="#e3e7ee"/>
  <rect x="6" y="234" width="748" height="1" fill="#e3e7ee"/>
  <!-- Summenzeile -->
  <rect x="0" y="290" width="760" height="2" fill="#2f80ed"/>
  <rect x="6" y="292" width="748" height="47" rx="7" ry="7" fill="#f6f8fb"/>

  <text x="15" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b7a90">BuTag</text>
  <text x="90" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b7a90">Wert</text>
  <text x="175" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b7a90">Vorgang</text>
  <text x="750" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#6b7a90" text-anchor="end">
  Alter Kontostand: <tspan id="kontoauszugKontostand_alt"></tspan></text>
  <text x="750" y="317" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#0b3a6e" text-anchor="end">
  Neuer Kontostand: <tspan id="kontoauszugKontostand_neu"></tspan></text>

  <!-- Transaktionen -->
  <g id="kontoauszugDatum1"><text x="15" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#333333"><tspan class="kontoauszugDatum"></tspan></text>
  <text x="90" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#333333"><tspan class="kontoauszugDatum"></tspan></text></g>
  <text id="kontoauszugVorgang1" x="175" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#333333"></text>
  <text id="kontoauszugWertstellung1" x="750" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#333333" text-anchor="end"><tspan>-</tspan></text>
  <g id="kontoauszugDatum2"><text x="15" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#333333"><tspan class="kontoauszugDatum"></tspan></text>
  <text x="90" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#333333"><tspan class="kontoauszugDatum"></tspan></text></g>
  <text id="kontoauszugVorgang2" x="175" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#333333"></text>
  <text id="kontoauszugWertstellung2" x="750" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#333333" text-anchor="end"><tspan>-</tspan></text>
  <g id="kontoauszugDatum3"> <text x="15" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#333333"><tspan class="kontoauszugDatum"></tspan></text>
  <text x="90" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#333333"><tspan class="kontoauszugDatum"></tspan></text></g>
  <text id="kontoauszugVorgang3" x="175" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#333333"></text>
  <text id="kontoauszugWertstellung3" x="750" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#333333" text-anchor="end"><tspan>-</tspan></text>

  <!-- Footer -->
  <text x="755" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6b7a90" text-anchor="end">Auszug vom <tspan class="kontoauszugDatum"></tspan>, letzter Auszug am <tspan class="kontoauszugDatum-7"></tspan></text>
</svg>