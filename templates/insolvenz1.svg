<svg id="insolvenzSVG" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 820" font-family="Arial" font-size="18" style="height:auto;background-color:#fff;padding:0px;width:100%;max-width:560px;">
  <!-- Tablet-Gehaeuse (typischer schwarzer Rand), schmales Hochformat -->
  <rect x="5" y="5" width="550" height="810" rx="46" fill="#17181c" />
  <rect x="5" y="5" width="550" height="810" rx="46" fill="none" stroke="#2a2c33" stroke-width="2" />
  <circle cx="280" cy="15" r="3.5" fill="#3a3d45" />
  <defs>
    <clipPath id="insolvenzScreenClip"><rect x="24" y="24" width="512" height="772" rx="12" /></clipPath>
  </defs>
  <!-- Bildschirm -->
  <rect x="24" y="24" width="512" height="772" rx="12" fill="#ffffff" />
  <g clip-path="url(#insolvenzScreenClip)" fill="#23262b">
    <!-- Dezente Browser-Chrome: Home / Zurueck / Vor / Neuladen + Adresszeile -->
    <rect x="24" y="24" width="512" height="44" fill="#eef1f4" />
    <circle cx="46" cy="46" r="11" fill="#ffffff" stroke="#d6dce2" stroke-width="1" />
    <path d="M46 40 l-7 5.8 h2.4 v4.2 h9.2 v-4.2 h2.4 z" fill="#5a6470" />
    <circle cx="74" cy="46" r="11" fill="#ffffff" stroke="#d6dce2" stroke-width="1" />
    <path d="M80 46 H68" fill="none" stroke="#5a6470" stroke-width="2" stroke-linecap="round" />
    <path d="M71.8 42 l-4.2 4 4.2 4" fill="none" stroke="#5a6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="102" cy="46" r="11" fill="#ffffff" stroke="#d6dce2" stroke-width="1" />
    <path d="M96 46 H108" fill="none" stroke="#5a6470" stroke-width="2" stroke-linecap="round" />
    <path d="M104.2 42 l4.2 4 -4.2 4" fill="none" stroke="#5a6470" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="130" cy="46" r="11" fill="#ffffff" stroke="#d6dce2" stroke-width="1" />
    <path d="M134.3 42 a5.6 5.6 0 1 0 1.2 4.6" fill="none" stroke="#5a6470" stroke-width="1.9" />
    <path d="M134.6 42.2 l3.6 -0.6 -0.5 3.8 z" fill="#5a6470" />
    <rect x="142" y="37" width="220" height="18" rx="9" fill="#ffffff" stroke="#d6dce2" stroke-width="1" />
    <text x="152" y="50.5" font-size="12" fill="#454d55">https://www.insolvenzbekanntmach...</text>
    <line x1="24" y1="68.5" x2="536" y2="68.5" stroke="#d6dce2" stroke-width="1" />
    <!-- Bekanntmachungstext -->
    <text x="30" y="96">In dem Verfahren über den Antrag von</text>
    <text x="30" y="124"><tspan id="insolvenzSchuldnerZeile1">###</tspan></text>
    <text id="insolvenzSchuldnerZeile2" x="30" y="152">###</text>
    <text x="30" y="180">vertreten durch<tspan id="insolvenzSchuldnerInhaber">###</tspan></text>
    <text x="30" y="208">Registergericht: <tspan id="insolvenzRegistergericht">###</tspan></text>
    <text x="30" y="236">- Schuldner/-in -</text>
    <text x="30" y="272">[...]</text>
    <text x="30" y="308">auf Eröffnung des Insolvenzverfahrens</text>
    <text x="30" y="336">über das eigene Vermögen</text>
    <text x="30" y="376">1.</text>
    <text x="62" y="376">Das Insolvenzverfahren über das Vermögen</text>
    <text x="62" y="404">der Schuldner/-in wird wegen</text>
    <text id="insolvenzGrund" x="62" y="432">###</text>
    <text x="62" y="460">am <tspan id="insolvenzOeffnungDatum">###</tspan> um <tspan id="insolvenzOeffnungZeit">###</tspan> Uhr eröffnet.</text>
    <text x="30" y="506">2.</text>
    <text x="62" y="506">Zum Insolvenzverwalter wird bestellt:</text>
    <text id="insolvenzVerwalterName" x="98" y="534" text-decoration="underline">###</text>
    <text id="insolvenzVerwalterAdresse" x="98" y="562">###</text>
    <text x="98" y="590">Telefon: <tspan id="insolvenzVerwalterTelefon">###</tspan></text>
    <text x="98" y="618">Telefax: <tspan id="insolvenzVerwalterTelefax">###</tspan></text>
    <text x="98" y="646">Email: <tspan id="insolvenzVerwalterEmail" fill="#1155cc" text-decoration="underline">###</tspan></text>
    <text x="30" y="692">3.</text>
    <text x="62" y="692">Die Insolvenzgläubiger werden aufgefordert,</text>
    <text x="62" y="720">Insolvenzforderungen (§ 38 InsO) bis zum <tspan id="insolvenzFrist">###</tspan></text>
    <text x="62" y="748">bei dem Insolvenzverwalter schriftlich</text>
    <text x="62" y="776">anzumelden.</text>
  </g>
</svg>
