<svg id="insolvenzSVG" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" font-family="Arial" font-size="18" style="height:auto;background-color:#fff;padding:0px;width:100%;max-width:760px;">
  <!-- Tablet-Gehaeuse (typischer schwarzer Rand) -->
  <rect x="5" y="5" width="750" height="750" rx="46" fill="#17181c" />
  <rect x="5" y="5" width="750" height="750" rx="46" fill="none" stroke="#2a2c33" stroke-width="2" />
  <circle cx="380" cy="15" r="3.5" fill="#3a3d45" />
  <defs>
    <clipPath id="insolvenzScreenClip"><rect x="26" y="26" width="708" height="700" rx="12" /></clipPath>
  </defs>
  <!-- Bildschirm -->
  <rect x="26" y="26" width="708" height="700" rx="12" fill="#ffffff" />
  <g clip-path="url(#insolvenzScreenClip)" fill="#23262b">
    <!-- Dezente Browser-Chrome: Home / Zurueck / Vor / Neuladen + Adresszeile -->
    <rect x="26" y="26" width="708" height="44" fill="#eef1f4" />
    <circle cx="52" cy="48" r="12" fill="#ffffff" stroke="#d6dce2" stroke-width="1" />
    <path d="M52 41.4 l-7.6 6.2 h2.6 v4.6 h10 v-4.6 h2.6 z" fill="#5a6470" />
    <circle cx="84" cy="48" r="12" fill="#ffffff" stroke="#d6dce2" stroke-width="1" />
    <path d="M90.6 48 H77.5" fill="none" stroke="#5a6470" stroke-width="2.1" stroke-linecap="round" />
    <path d="M81.8 43.7 l-4.5 4.3 4.5 4.3" fill="none" stroke="#5a6470" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="116" cy="48" r="12" fill="#ffffff" stroke="#d6dce2" stroke-width="1" />
    <path d="M109.4 48 H122.5" fill="none" stroke="#5a6470" stroke-width="2.1" stroke-linecap="round" />
    <path d="M118.2 43.7 l4.5 4.3 -4.5 4.3" fill="none" stroke="#5a6470" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="148" cy="48" r="12" fill="#ffffff" stroke="#d6dce2" stroke-width="1" />
    <path d="M152.7 43.7 a6 6 0 1 0 1.3 5" fill="none" stroke="#5a6470" stroke-width="2" />
    <path d="M153 43.9 l3.9 -0.7 -0.5 4.1 z" fill="#5a6470" />
    <rect x="170" y="37" width="544" height="22" rx="11" fill="#ffffff" stroke="#d6dce2" stroke-width="1" />
    <text x="182" y="52.5" font-size="13" fill="#454d55">https://www.insolvenzbekanntmachungen.de/…</text>
    <line x1="26" y1="70.5" x2="734" y2="70.5" stroke="#d6dce2" stroke-width="1" />
    <!-- Bekanntmachungstext -->
    <text x="44" y="104">In dem Verfahren über den Antrag von</text>
    <text x="44" y="132"><tspan id="insolvenzSchuldnerZeile1">###</tspan> <tspan id="insolvenzSchuldnerZeile2">###</tspan></text>
    <text x="44" y="160"><tspan id="insolvenzSchuldnerVertreter">vertreten durch den Geschäftsführer</tspan><tspan id="insolvenzSchuldnerInhaber">###</tspan></text>
    <text x="44" y="188">Registergericht: <tspan id="insolvenzRegistergericht">###</tspan></text>
    <text x="44" y="216">- Schuldner/-in -</text>
    <text x="44" y="252">[...]</text>
    <text x="44" y="292">auf Eröffnung des Insolvenzverfahrens über das eigene Vermögen</text>
    <text x="44" y="340">1.</text>
    <text x="76" y="340">Das Insolvenzverfahren über das Vermögen der Schuldner/-in wird wegen</text>
    <text x="76" y="368"><tspan id="insolvenzGrund">###</tspan> am <tspan id="insolvenzOeffnungDatum">###</tspan> um <tspan id="insolvenzOeffnungZeit">###</tspan> Uhr eröffnet.</text>
    <text x="44" y="406">2.</text>
    <text x="76" y="406">Zum Insolvenzverwalter wird bestellt:</text>
    <text id="insolvenzVerwalterName" x="112" y="434" text-decoration="underline">###</text>
    <text id="insolvenzVerwalterAdresse" x="112" y="462">###</text>
    <text x="112" y="490">Telefon: <tspan id="insolvenzVerwalterTelefon">###</tspan> · Telefax: <tspan id="insolvenzVerwalterTelefax">###</tspan></text>
    <text x="112" y="518">Email: <tspan id="insolvenzVerwalterEmail" fill="#1155cc" text-decoration="underline">###</tspan></text>
    <text x="44" y="556">3.</text>
    <text x="76" y="556">Die Insolvenzgläubiger werden aufgefordert, Insolvenzforderungen</text>
    <text x="76" y="584">(§ 38 InsO) bis zum <tspan id="insolvenzFrist">###</tspan> bei dem Insolvenzverwalter schriftlich</text>
    <text x="76" y="612">anzumelden.</text>
  </g>
</svg>
