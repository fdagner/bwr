<svg id="rechnungSVG" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 520 520" style="height: auto;background-color: rgb(255, 255, 255); padding: 0px; width: 100%; border: 1px solid rgb(204, 204, 204);">
  <defs id="customDefs">
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <style>
      .hand { font-family: "Segoe Script", "Brush Script MT", "Comic Sans MS", "Marker Felt", "Chalkboard SE", cursive; }
      .sans { font-family: Verdana, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <!-- Post-it Grundfläche (hellgelb) -->
  <rect x="0" y="0" width="520" height="520" rx="8" ry="8" fill="#fffde7" filter="url(#shadow)" stroke="#f0e68c" stroke-width="1"/>

  <!-- Titel -->
  <g class="hand" fill="#1a237e">
    <text x="40" y="62" font-size="18" font-weight="bold">Telefonnotiz</text>
  </g>
  <!-- Datum rechtsbündig -->
  <g class="hand" fill="#1a237e" font-size="16">
    <text x="480" y="46" text-anchor="end"><tspan fill="#8d6e63" font-size="16" class="sans">Datum: </tspan><tspan class="rechnungsDatum">01.01.</tspan><tspan class="aktuellesJahr"></tspan></text>
  </g>

  <!-- Gesprächspartner -->
  <g class="sans" fill="#8d6e63" font-size="16">
    <text x="40" y="95">Gesprächspartner:</text>
  </g>
  <g id="liefererDaten" class="hand" fill="#1a237e">
    <text id="nameLangLieferer" x="40" y="126" font-size="16"></text>
    <line x1="40" y1="130" x2="480" y2="130" stroke="#e6df8a" stroke-width="1"/>
  </g>

  <!-- Angebot: "21 Stück Räder je 129,00" -->
  <g id="bestellDaten" class="hand" fill="#1a237e">
    <text x="40" y="165" font-size="16" font-weight="bold" fill="#1a237e">Angebot:</text>
    <text x="40" y="195" font-size="16">
      <tspan id="menge1"></tspan>
      <tspan dx="6" id="artikel1"></tspan>
      <tspan dx="6">je</tspan>
      <tspan dx="6" id="einzelpreis1"></tspan>
    </text>
    <text x="40" y="218" font-size="16" fill="#1a237e">zuzüglich Umsatzsteuer</text>
    <text id="rabatt" x="40" y="240" font-size="16"></text>
    <text x="40" y="262" font-size="16"><tspan id="bezugskosten"></tspan> <tspan id="bezugskostenSumme"></tspan></text>
    <text id="bezugskostenBedingung" x="40" y="280" font-size="16" fill="#1a237e"></text>
    <line x1="40" y1="292" x2="480" y2="292" stroke="#e6df8a" stroke-width="1"/>
  </g>

  <!-- Zahlungsbedingungen -->
  <g id="Zahlungsbedingungen" class="hand" fill="#1a237e" font-size="16">
    <g id="zahlungszielSatz">
      <text x="40" y="310"><tspan>Zahlungsziel: </tspan><tspan id="zahlungsziel"></tspan><tspan> Tage netto</tspan><tspan id="skontoSuffix"></tspan></text>
    </g>
    <text x="40" y="335"><tspan>Lieferzeit: </tspan><tspan id="angebotLieferzeit"></tspan><tspan> Tage</tspan></text>
  </g>

  <!-- Weiteres Vorgehen -->
  <line x1="40" y1="355" x2="480" y2="355" stroke="#e6df8a" stroke-width="1"/>
  <g class="sans" font-size="14" fill="#5d4037">
    <text x="40" y="378" font-weight="bold">Weiteres Vorgehen:</text>
  </g>
  <g class="sans" font-size="12" fill="#3e2723">
    <rect x="40" y="388" width="11" height="11" stroke="#b8a830" stroke-width="1" fill="#fffde7"/>
    <text x="56" y="398">Rückruf erbeten</text>
    <rect x="175" y="388" width="11" height="11" stroke="#b8a830" stroke-width="1" fill="#fffde7"/>
    <text x="191" y="398">Angebot zusenden</text>
    <rect x="330" y="388" width="11" height="11" stroke="#b8a830" stroke-width="1" fill="#fffde7"/>
    <text x="346" y="398">Auftrag erteilt</text>

    <rect x="40" y="408" width="11" height="11" stroke="#b8a830" stroke-width="1" fill="#fffde7"/>
    <text x="56" y="418">Info per E-Mail</text>
    <rect x="175" y="408" width="11" height="11" stroke="#b8a830" stroke-width="1" fill="#fffde7"/>
    <text x="191" y="418">Termin vereinbaren</text>
    <rect x="330" y="408" width="11" height="11" stroke="#b8a830" stroke-width="1" fill="#fffde7"/>
    <text x="346" y="418">Erledigt</text>
  </g>

  <!-- Unterschrift -->
  <g class="sans" fill="#3e2723" font-size="12">
    <text x="40" y="465">Notiz aufgenommen von:</text>
  </g>
  <line x1="40" y1="452" x2="480" y2="452" stroke="#d7cc6a" stroke-width="0.8"/>
</svg>
