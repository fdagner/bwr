<div id="mailHtml"
  style="font-family:Arial,Helvetica,sans-serif;width:700px;background:#fff;border:1.5px solid #2b4a73;color:#000;">
  <div
    style="display:flex;align-items:center;justify-content:space-between;background:#2b4a73;color:#fff;font-size:12px;height:26px;padding:0 10px;">
    <span style="display:flex;align-items:center;gap:9px;">
      <svg width="15" height="11" viewBox="0 0 15 11">
        <rect width="15" height="11" rx="1" fill="#fff" />
        <path d="M0 0 L7.5 6.5 L15 0" fill="none" stroke="#2b4a73" stroke-width="1.2" />
      </svg>
      Neue Nachricht

    <span style="display:flex;align-items:center;gap:8px;padding:0 12px 0 5px;height:22px;"><svg width="20" height="14"

        <path d="M15 1 L8 7 L15 13 M7 1 L0 7 L7 13" fill="none" stroke="#1e7ad6" stroke-width="2" />
      </svg>Allen antworten</span>
    <span style="display:flex;align-items:center;gap:8px;padding:0 12px;height:22px;border-left:1px solid #c9d3df;"><svg

    <span style="display:flex;align-items:center;gap:8px;padding:0 12px;height:22px;border-left:1px solid #c9d3df;"><svg

        <path d="M1 1 L13 13 M13 1 L1 13" fill="none" stroke="#d6336c" stroke-width="2.2" />
      </svg>Löschen</span>
  </div>

  <div
    style="display:flex;align-items:center;gap:14px;background:#f1f6fc;padding:16px 12px 14px;border-bottom:1px solid #c9d3df;flex-wrap:wrap;">
    <div
      style="width:75px;height:75px;color:#fff;font-weight:bold;font-size:16px;display:flex;align-items:center;justify-content:center;">
      <svg id="emailSVG" style="width:65px;height:65px;display:block;" viewBox="0 0 50 50">
        <rect id="logo-placeholderEmail" x="0" y="0" width="50" Opacity="0" height="50" />
      </svg>
    </div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:17px;color:#5b6b7c;"><span class="emailInhaber" style="font-weight:bold;color:#1b4f8f;min-height:1.2em;"></span></div>
      <div style="font-size:17px;color:#0b1724;margin-top:6px;"><span style="color:#0b1724;">An:</span> <span

  </div>
