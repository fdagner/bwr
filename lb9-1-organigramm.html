<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organigramm Generator – Einliniensystem &amp; Mehrliniensystem | meinbwr.de BwR</title>
  <meta name="description" content="Kostenloses BwR-Tool: Organigramme für Einliniensystem und Mehrliniensystem mit Modellunternehmen, Zufallspersonen und optionaler Stabsstelle erstellen und als PNG oder SVG exportieren.">
  <link rel="canonical" href="https://www.meinbwr.de/lb9-1-organigramm.html">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#2c5f2d">
  <meta name="color-scheme" content="light">

  <link rel="stylesheet" href="css/style.css">
  <script src="js/js-yaml.min.js"></script>
  <script src="js/menu.js"></script>
  <style>
    .ao-zeile { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
    .ao-zeile span { width: 150px; flex-shrink: 0; font-size: 0.9rem; }
    .ao-zeile input { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; }
    #organigramm { overflow-x: auto; background: #fff; border: 1px solid #ddd; padding: 8px; }
    #organigramm svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
    .ao-optionen label { margin-right: 18px; }
  </style>
</head>

<body>
  <main>
    <div w3-include-html="navigation.html"></div>
    <h2>Organigramm</h2>

    <div class="box">
      <p>Erstellen Sie ein Organigramm für ein Modellunternehmen. Der Inhaber wird als CEO eingesetzt, alle Personen und Bezeichnungen lassen sich ändern.</p>
      <h3>Einstellungen</h3>
      <div class="flex-row">
        <div>
          <label for="unternehmen">Modellunternehmen:</label>
          <select id="unternehmen"></select>
        </div>
        <div>
          <label for="typ">Organisationssystem:</label>
          <select id="typ">
            <option value="ein" selected>Einliniensystem</option>
            <option value="mehr">Mehrliniensystem</option>
          </select>
        </div>
        <div>
          <label for="anzahl">Anzahl der Abteilungen:</label>
          <select id="anzahl">
            <option value="2">2</option><option value="3">3</option>
            <option value="4" selected>4</option><option value="5">5</option>
          </select>
        </div>
        <div>
          <label for="tiefe">Ebenen unter der Geschäftsleitung:</label>
          <select id="tiefe">
            <option value="1">1 (Abteilungen)</option>
            <option value="2" selected>2 (Abteilungen und Teams)</option>
            <option value="3">3 (zusätzlich Sachbearbeitung)</option>
          </select>
        </div>
      </div>
      <p class="ao-optionen" style="margin-top: 12px;">
        <label><input type="checkbox" id="stab"> Stabsstelle anzeigen</label>
        <label><input type="checkbox" id="titel" checked> Firmenname als Überschrift</label>
      </p>
      <button type="button" onclick="erstelleModell()">Neu erstellen</button>
      <button type="button" onclick="neuePersonen()">Neue Personen</button>
    </div>

    <div class="box" style="margin-top: 16px;">
      <h3>Bezeichnungen und Personen bearbeiten</h3>
      <div class="ao-zeile"><span>Firmenname</span><input id="firma" aria-label="Firmenname"></div>
      <div id="editor"></div>
    </div>

    <div style="margin-top: 20px;">
      <div id="organigramm"></div>
      <p style="margin-top: 12px;">
        <button type="button" onclick="exportierePng()">Als PNG herunterladen</button>
        <button type="button" onclick="exportiereSvg()">Als SVG herunterladen</button>
      </p>
    </div>
  </main>

  <script src="js/lb9-1-organigramm.js"></script>
  <div w3-include-html="footer.html"></div>
  <script>
    includeHTML();
    startOrganigramm();
  </script>
</body>

</html>
