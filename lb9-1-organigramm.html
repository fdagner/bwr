    <h2>Organigramm</h2>

    <div class="box">
      <p>Erstellen Sie ein Organigramm für ein Modellunternehmen. Der Inhaber wird als CEO eingesetzt, alle Personen und
        Bezeichnungen lassen sich ändern.</p>
      <h3>Unternehmen wählen</h3>
      <div>
        <label for="unternehmen">Modellunternehmen:</label>
        <select id="unternehmen" name="unternehmen" class="meinUnternehmen"></select>
      </div>
      <h3>Daten</h3>

      <div class="grid3">
        <fieldset class="vorlage-green" style="max-width: 350px">
          <legend>System</legend>
          <div class="form-field">
            <label for="typ">Organisationssystem:</label>
            <select id="typ" name="typ">
              <option value="ein" selected>Einliniensystem</option>
              <option value="mehr">Mehrliniensystem</option>
              <option value="matrix">Matrixorganisation</option>
            </select>
          </div>
        </fieldset>
          <fieldset class="vorlage-blue" style="max-width: 350px">
            <legend>Daten</legend>
            <div class="form-field">
                <label for="anzahl">Anzahl der Abteilungen:</label>
                <select id="anzahl" name="anzahl">
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4" selected>4</option>
                  <option value="5">5</option>
                </select>
                <label for="personen">Personen pro Team:</label>
                <select id="personen" name="personen">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3" selected>3</option>
                  <option value="4">4</option>
                </select>
                <label for="tiefe">Ebenen unter der Geschäftsleitung:</label>
                <select id="tiefe" name="tiefe">
                  <option value="1">1 (Abteilungen)</option>
                  <option value="2" selected>2 (Abteilungen und Teams)</option>
                  <option value="3">3 (zusätzlich Sachbearbeitung)</option>
                </select>
            </div>
          </fieldset>
  <fieldset class="vorlage-grey" style="max-width: 350px">
            <legend>Extras</legend>
      
          <label><input type="checkbox" id="stab" name="stab">Stabsstelle</label><br><br>

          <label><input type="checkbox" id="keineLinien" name="keineLinien">Alle Pfeile und Linien ausblenden (nur Karten)</label><br><br>

          <label><input type="checkbox" id="titel" name="titel" checked> Firmenname als Überschrift</label>
          <br><br>
          <label for="farbschema">Farbschema:</label>
          <select id="farbschema" name="farbschema">
            <option value="weiss">Weiß (Standard)</option>
            <option value="pastell" selected>Pastell</option>
            <option value="retro">Retro</option>
            <option value="kontrast">Kontrast</option>
          </select>
       
          </fieldset>


        </div>
<br><br>
        <div class="btn-aktion-row">
