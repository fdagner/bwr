<body>
  <main>
    <div w3-include-html="navigation.html"></div>
    <h2>Organigramm</h2>

    <div class="box">
      <p>Erstellen Sie ein Organigramm für ein Modellunternehmen. Der Inhaber wird als CEO eingesetzt, alle Personen und
        Bezeichnungen lassen sich ändern.</p>
      <h3>Unternehmen wählen</h3>
      <div>
        <label for="unternehmen">Modellunternehmen:</label>
        <select id="unternehmen" class="meinUnternehmen"></select>
      </div>
      <h3>Daten</h3>

      <div class="grid3">
        <fieldset class="vorlage-green" style="max-width: 350px">
          <legend>System</legend>
          <div class="form-field">
            <label for="typ">Organisationssystem:</label>
            <select id="typ">
              <option value="ein" selected>Einliniensystem</option>
              <option value="mehr">Mehrliniensystem</option>
              <option value="matrix">Matrixorganisation</option>
            </select>
          </div>
        </fieldset>
          <fieldset class="vorlage-blue" style="max-width: 350px">
            <legend>Daten</legend>
            <div class="form-field">
                <label for="anzahl">Anzahl der Abteilungen:</label>
                <select id="anzahl">
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4" selected>4</option>
                  <option value="5">5</option>
                </select>
                <label for="personen">Personen pro Team:</label>
                <select id="personen">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3" selected>3</option>
                  <option value="4">4</option>
                </select>
                <label for="tiefe">Ebenen unter der Geschäftsleitung:</label>
                <select id="tiefe">
                  <option value="1">1 (Abteilungen)</option>
                  <option value="2" selected>2 (Abteilungen und Teams)</option>
                  <option value="3">3 (zusätzlich Sachbearbeitung)</option>
                </select>
            </div>
          </fieldset>
  <fieldset class="vorlage-grey" style="max-width: 350px">
            <legend>Extras</legend>
      
          <label><input type="checkbox" id="stab">Stabsstelle</label><br><br>
          <label><input type="checkbox" id="titel" checked> Firmenname als Überschrift</label>
       
          </fieldset>


        </div>
<br><br>
  <button type="button" onclick="erstelleModell()">Neu erstellen</button>
        <button type="button" onclick="neuePersonen()">Neue Personen</button>
      
      </div>

      

      <div class="box" style="margin-top: 16px;">
        <h3>Bezeichnungen und Personen bearbeiten</h3>
        <p id="inhaberHinweis" style="color:#b71c1c;"></p>
        <div class="ao-zeile"><span>Firmenname</span><input id="firma" aria-label="Firmenname"></div>
        <div id="editor"></div>
      </div>

      <div class="output-wrapper" style="display: flex; gap: 20px; margin-top: 20px;">
        <div id="Container" style="min-width: 580px; flex: 1;" contenteditable="true"></div>
        <div id="button-column" style="width: 180px; flex-shrink: 0;"></div>
      </div>
