  <body>
    <main>
      <div w3-include-html="navigation.html"></div>
      <h2>Diagramme Vollkostenrechnung - beta</h2>

      <div class="box">
        <!-- Diagrammcontainer -->
        <div id="controls" class="flex-column">
          <!-- Eingabefelder -->
          <div>
            <h3>Materialkosten</h3>
            <label for="fertigungsmaterial">Fertigungsmaterial (€):</label>
            <input
              type="number"
              id="fertigungsmaterial"
              min="0"
              max="99000000"
              value="500000"
            />
          </div>
          <div>
            <label for="zuschlagssatz"
              >Materialgemeinkostenzuschlagssatz (%):</label
            >
            <input
              type="number"
              id="zuschlagssatz"
              min="1"
              max="25"
              value="10"
            />
          </div>
          <div>
            <label for="ticks-slider">Y-Achse skalieren:</label>
            <input
              type="range"
              id="ticks-slider"
              min="1"
              max="15"
              value="10"
              step="1"
              data-on-input='[{"fn":"updateTickAmount","args":["__VALUE__"]}]'
            />
            <span id="ticks-value"></span>
          </div>
        </div>
        <br />
        <div>
          <button data-on-click='[{"fn":"toggleDataLabels","args":[]}]'>
            Werte auf Säulen ein/ausblenden
          </button>
        </div>
        <br />
      </div>
      <div>
        <button
          type="button"
          class="btn-uebernehmen"
          data-on-click='[{"fn":"updateChart","args":[]}]'
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640"
            fill="currentColor"
            height="16"
            width="16"
            aria-hidden="true"
          >
            <path
              d="M320 576C178.6 576 64 461.4 64 320C64 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320C576 461.4 461.4 576 320 576zM320 112C205.1 112 112 205.1 112 320C112 434.9 205.1 528 320 528C434.9 528 528 434.9 528 320C528 205.1 434.9 112 320 112zM390.7 233.9C398.5 223.2 413.5 220.8 424.2 228.6C434.9 236.4 437.3 251.4 429.5 262.1L307.4 430.1C303.3 435.8 296.9 439.4 289.9 439.9C282.9 440.4 276 437.9 271.1 433L215.2 377.1C205.8 367.7 205.8 352.5 215.2 343.2C224.6 333.9 239.8 333.8 249.1 343.2L285.1 379.2L390.7 234z"
            />
          </svg>
          Daten übernehmen
        </button>
      </div>

      <div id="chart"></div>

      <div id="controls" class="flex-column">
        <div>
          <h3>Fertigungskosten</h3>
          <label for="fertigungslöhne">Fertigungslöhne (€):</label>
          <input
            type="number"
            id="fertigungslöhne"
            min="0"
            max="99000000"
            value="250000"
          />
        </div>
        <div>
          <label for="fertigungsgemeinkosten"
            >Fertigungsgemeinkosten in (%):</label
          >
          <input
            type="number"
            id="fertigungsgemeinkosten"
            min="100"
            max="200"
            value="120"
          />
        </div>
        <div>
          <label for="sondereinzelkosten">Sondereinzelkosten (€):</label>
          <input
            type="number"
            id="sondereinzelkosten"
            min="0"
            max="99000000"
            value="15000"
          />
        </div>
        <br />
      </div>
      <div>
        <button
          type="button"
          class="btn-uebernehmen"
          data-on-click='[{"fn":"updateChart","args":[]}]'

            xmlns="http://www.w3.org/2000/svg"
