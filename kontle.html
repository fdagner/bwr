  <body>
    <main>
      <div w3-include-html="navigation.html"></div>
      <h2>BwR-Kontle</h2>
      <p>
        Welches Konto aus dem Kontenplan Bayerische Realschule wird gesucht?<br />Grenzenloser
        Spielspaß: <i class="fa fa-gamepad" aria-hidden="true"></i> bei jedem
        Seitenaufruf wird ein neues Konto gesucht.
      </p>

      <div id="Container">
        <div class="wordle">
          <h1>BwR-Kontle</h1>
          <div id="grid"></div>
          <div id="keyboard"></div>
        </div>
      </div>

      <div class="export-buttons" data-exports="html,source"></div>

      <style>
        .button,
        .keys,
        .rows,
        .wordle {
          display: flex;
        }
        .wordle {
          touch-action: pan-x pan-y pinch-zoom;
          background: #f5f7fa;
          color: #2c3e50;
          font-family: sans-serif;
          text-align: center;
          text-transform: uppercase;
          flex-direction: column;
        }
        #grid {
          flex: 1 1 auto;
        }
        .button {
          border: 0;
          padding: 4px !important;
          margin: 2px !important;
          height: 2.5em;
          border-radius: 4px;
          cursor: pointer;
          user-select: none;
          flex: 1;
          justify-content: center;
          align-items: center;
          text-transform: lowercase;
          background: #e0e6ed;
          color: #2c3e50;
        }
        .button:hover {
          background: #d0d8e4;
        }
        #keyboard {
          margin: 10px auto;
          padding: 0 !important;
          max-width: 500px;
          width: 100%;
        }
        .wordle .cell {
          width: 60px;
          height: 60px;
          line-height: 60px;
          display: inline-block;
          margin: 4px;
          font-size: 40px;
          font-weight: 700;
          perspective: 1000px;
          color: #2c3e50;
        }
        .cell .back,
        .wordle .cell .front {
          border: 2px solid #b0b8c4;
          backface-visibility: hidden;
          position: absolute;
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
          background: #ffffff;
        }
        .keys {
          margin: 0 auto 2px;
          touch-action: manipulation;
        }
        .rows {
          flex-direction: row;
          flex-wrap: nowrap;
          justify-content: center;
        }
        .cell.solved .surface {
          transform: rotateX(180deg);
        }
        .cell .surface {
          transition-duration: 2s;
          transform-style: preserve-3d;
          position: relative;
          width: 100%;
          height: 100%;
        }
        .cell .front {
          z-index: 2;
          background: #ffffff;
        }
        .cell.solved .front {
          display: none;
        }
        .cell .back {
          z-index: 1;
          transform: rotateX(180deg);
          background: #e8ecf1;
        }
        @keyframes press {
          from {
            opacity: 0.5;
            transform: scale(0.95);
          }
          50% {
            opacity: 0.85;
            transform: scale(1.1);
          }
          to {
            opacity: 1;
            transform: scale(1);
          }
        }
      </style>
    </main>
