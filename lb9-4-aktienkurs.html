        <h2>Aktienkauf mit Diagramm</h2>
        <div class="box">
            <p>Sie können einen zufällige Aktienkurs erzeugen, ausgehend vom aktuellen Datum. Über das Burger-Menü kann
                das Diagramm heruntergeladen werden. Zum Schlusskurs kann eine Aufgabe erstellt werden. Wählen Sie Kauf oder Verkauf.</p>
            <div id="controls" class="flex-column">
                <div>
                    <label for="wertpapiereArtInput">Art: </label><br>
                    <select id="wertpapiereArtInput">
                        <option value="wertpapiereKauf">Kauf</option>
                        <option value="wertpapiereVerkauf">Verkauf</option>
                    </select>
                </div>
                <div>
                    <label for="aktienKaeufer">Käufer/Verkäufer (eigenes Unternehmen):</label><br>
                    <select id="aktienKaeufer" class="meinUnternehmen">
                        <!-- Wird aus localStorage/YAML befüllt -->
                    </select>
                </div>
                <div><label for="unternehmen">AG-Unternehmen wählen:</label><br>
                    <select id="unternehmen">
                        <!-- Dropdown-Optionen werden hier dynamisch hinzugefügt -->
                    </select>
                </div>
                <div style="display: none"><label for="year">Jahr für den Schlusswert (nur bei Monate):</label>
                    <input type="number" id="year" min="1900" max="2100">
                </div>
                <div class="flex-row">
                    <div>
                        <label for="period">Zeitraum:</label>
                        <input type="number" id="period" value="8" min="6" max="13">
                    </div>
                    <div>
                        <label for="timeframe">Einheit:</label>
                        <select id="timeframe">
                            <option value="days">Tage</option>
   
                        </select>
                    </div>
                </div>
 <div id="chart" style="width: 100%;"></div>

                <div>                <button type="button" class="btn-zufall" id="generate-chart">

<button type="button" onclick="window.print()">Drucken</button></div>
